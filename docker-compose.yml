services:
  whatshap-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatshap-gateway
    restart: unless-stopped
    ports:
      - "3020:3020"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./.env:/app/.env:ro
      - ./data:/app/data
      - ./wa_session.db:/app/wa_session.db
      - ./Uji-Bank-Pertanyaan-Programmer-4.xlsx:/app/Uji-Bank-Pertanyaan-Programmer-4.xlsx:ro
    environment:
      - TZ=Asia/Jakarta
      - DATABASE_URL=postgres://postgres:postgres@host.docker.internal:5432/whathsap-gateway-workbench?sslmode=disable
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
